<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Webデザイン用語の絵図鑑</title>
<style>
@font-face{font-family:"Zen Maru Gothic";src:url("fonts/ZenMaruGothic-Black.woff2") format("woff2");font-weight:900;font-display:swap}
@font-face{font-family:"Zen Kaku Gothic New";src:url("fonts/ZenKakuGothicNew-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Zen Kaku Gothic New";src:url("fonts/ZenKakuGothicNew-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
/* 指さし図鑑: 見本図(場所)と図解(しくみ)の2つの絵で用語を引く。深緑の線と珊瑚の「指した所」(2026-10-20 社長が配色を選択)。図鑑の紙の見え方に固定するため明るい配色のみ(意図して1テーマ) */
:root{
  --bg:#EDF3F0; --paper:#FFFFFF; --ink:#1F3A33; --sub:#506660; --hi:#FF8A7A; --hi-text:#A63A2C; --pale:#D6E3DD; --hi-line:#E5604F; --on-hi:#1F3A33;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0;font-weight:400}
p{margin:0}
a{color:var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--hi-line);outline-offset:2px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--paper);padding:8px 12px;border:2px solid var(--ink);z-index:20;font:inherit}
.skip:focus{left:max(16px,env(safe-area-inset-left,0px))}

/* ヘッダー */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--ink)}
.site-head .inner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:900;font-size:20px;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--hi);display:inline-block;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.gnav{display:flex;gap:4px;flex-wrap:wrap}
.gnav a{text-decoration:none;font-weight:700;font-size:15px;padding:6px 12px;border-radius:999px}
.gnav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.gnav a:not([aria-current="page"]):hover{background:var(--pale)}

main{padding-block:32px 72px;display:block}
main:focus,main:focus-visible{outline:none}
.stack{display:grid;gap:40px}
.eyebrow{font-size:14px;font-weight:700;color:var(--sub);letter-spacing:.06em}
.h-xl{font-family:var(--f-display);font-weight:900;font-size:clamp(32px,6vw,52px);line-height:1.2}
.h-l{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,4vw,34px)}
.h-m{font-family:var(--f-display);font-weight:900;font-size:22px}
.lead{font-size:17px;max-width:40em}
.muted{color:var(--sub)}
.small{font-size:14px}

/* 見本図 */
.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.figure-box{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:16px;display:grid;gap:12px;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.chips button{font:inherit;font-weight:700;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:15px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--on-hi)}
svg{display:block;width:100%;height:auto}
.lab{cursor:pointer}
[data-part]{cursor:pointer}
.pick{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:20px;display:grid;gap:10px}
.pick .nm{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1.3}
.go{display:inline-flex;align-items:center;gap:8px;justify-self:start;font-weight:700;text-decoration:none;border-bottom:3px solid var(--hi-line);padding-bottom:2px}

/* 一覧 */
.chapter{display:grid;gap:16px}
.chapter-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tile{display:grid;grid-template-rows:auto 1fr;text-decoration:none;background:var(--paper);border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.tile:hover{box-shadow:4px 4px 0 var(--hi)}
.tile .pic{background:var(--bg);border-bottom:2px solid var(--ink);padding:10px}
.tile .txt{padding:12px 14px;display:grid;gap:2px;align-content:start}
.tile .nm{font-family:var(--f-display);font-weight:900;font-size:18px;line-height:1.35}

/* 用語のページ */
.term-top{display:grid;gap:8px}
.term-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.zukai{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:16px;display:grid;gap:8px;min-width:0}
.zukai .cap{font-size:14px;font-weight:700;color:var(--sub);letter-spacing:.06em}
.side{display:grid;gap:16px;min-width:0}
.box{background:var(--paper);border-radius:8px;padding:16px 18px;display:grid;gap:8px}
.box h3{font-size:14px;font-weight:700;color:var(--sub);letter-spacing:.06em}
.order{font-size:17px;font-weight:700;border-left:4px solid var(--hi-line);padding-left:12px}
.who{font-size:13px;font-weight:700;color:var(--sub);margin-top:4px}
.order.ai{font-size:16px;font-weight:400;border-left-color:var(--ink)}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel a{font-weight:700;font-size:15px;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;background:var(--paper)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:16px}
.pager a{font-weight:700;text-decoration:none}

/* 使い方 */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:16px;counter-reset:s;max-width:760px}
.steps li{counter-increment:s;display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;background:var(--paper);border-radius:8px;padding:18px}
.steps li::before{content:attr(data-n);font-family:var(--f-display);font-weight:900;font-size:28px;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;line-height:1}
.steps h3{font-family:var(--f-display);font-weight:900;font-size:19px;margin-bottom:4px}

.site-foot{border-top:2px solid var(--ink);background:var(--paper)}
.site-foot .inner{padding-block:24px;display:grid;gap:6px;font-size:13px;color:var(--sub)}

@media (max-width:800px){
  .stage,.term-grid{grid-template-columns:1fr}
  .lab text,.lab path{display:none}
}
@media (prefers-reduced-motion:no-preference){
  [data-part],.lab{transition:opacity .25s}
}
</style>
<style id="lab-band-css">
@font-face{font-family:"Lab Band Add";src:url("../TeashiSansJPLab-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Lab Band Add";src:url("../TeashiSansJPLab-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Lab Band Sans";src:url("/assets/fonts/TeashiSansJP-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Lab Band Sans";src:url("/assets/fonts/TeashiSansJP-700.woff2") format("woff2");font-weight:700;font-display:swap}
.lab-band{all:initial;display:block;box-sizing:border-box;background-color:#EEF1EC;background-image:linear-gradient(#C9D3CF 1px,transparent 1px),linear-gradient(90deg,#C9D3CF 1px,transparent 1px);background-size:8px 8px;border-bottom:1.5px solid #15191C;border-left:6px double #6A3FB5;color:#15191C;font:400 14px/1.7 "Lab Band Add","Lab Band Sans","Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding:8px 16px}
.lab-band *{box-sizing:border-box}
.lab-band .lab-band-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;max-width:1180px;margin:0 auto}
.lab-band .lab-band-tag{display:inline-block;margin:0;padding:1px 10px;background:#FFF4D6;color:#15191C;border:1.5px dashed #6A3FB5;font-weight:700;font-size:13px;letter-spacing:.06em}
.lab-band .lab-band-role{margin:0;flex:1 1 20em;min-width:0;background:#EEF1EC;overflow-wrap:anywhere}
.lab-band .lab-band-link{color:#6A3FB5;font-weight:700;text-decoration:underline;text-underline-offset:.22em;background:#EEF1EC}
.lab-band .lab-band-link:focus-visible{outline:3px solid #6A3FB5;outline-offset:2px}
</style>
</head>
<body>

<button class="skip" type="button" id="skip">本文へ移動</button>
<aside class="lab-band" aria-label="TEASHIラボ（株主制作・実績外）"><div class="lab-band-in"><p class="lab-band-tag">株主制作・実績外</p><p class="lab-band-role">人：題材の決定、書体と配色の選択、合格の判断／AI（Claude）：構成、文章、図、コード</p><a class="lab-band-link" href="../">TEASHIラボの一覧へ</a></div></aside>
<header class="site-head gutter">
  <div class="inner">
    <a class="brand" href="#top"><i aria-hidden="true"></i>Webデザイン用語の絵図鑑</a>
    <nav class="gnav" aria-label="サイトのページ">
      <a href="#top" data-nav="top">見本図</a>
      <a href="#list" data-nav="list">用語一覧</a>
      <a href="#more" data-nav="more">見本図にない言葉</a>
      <a href="#howto" data-nav="howto">使い方</a>
    </nav>
  </div>
</header>
<main id="main" class="gutter" tabindex="-1"><div class="inner" id="view"></div></main>
<footer class="site-foot gutter">
  <div class="inner">
    <p>TEASHIラボ（株主制作・実績外）</p>
    <p>見本図に出てくるお店のページ、URL(cafe-sample.example)、質問の文、検索結果の例は、説明のために作った架空のものです。</p>
    <p>絵はすべてこのページの中で描いた図(SVG)です。書体：Zen Maru Gothic・Zen Kaku Gothic New（OFL）</p>
  </div>
</footer>

<script>
const NARROW=matchMedia("(max-width:800px)");
/* 配色(深緑×珊瑚)。hiL は線・矢印・枠、hi は塗り、hiT は文字 */
const C={bg:"#EDF3F0",w:"#FFFFFF",ink:"#1F3A33",sub:"#506660",hi:"#FF8A7A",hiT:"#A63A2C",hiL:"#E5604F",pale:"#D6E3DD"};
const FONT="'Zen Kaku Gothic New',sans-serif";

/* ---------- 用語 ---------- */
const CH=[
  {id:"sp",nm:"スマホのページの部品",note:"見本図「スマホのページ」に場所があります"},
  {id:"pc",nm:"PCのページの部品",note:"見本図「PCのページ」に場所があります"},
  {id:"move",nm:"動く部品",note:"押すと開く・切り替わるもの。図解で動きを見せます"},
  {id:"none",nm:"場所のない言葉",note:"ページの上に場所はないけれど、発注でよく出る言葉"}
];
const TERMS=[
 {id:"header",ch:"sp",nm:"ヘッダー",alias:"",
  desc:"ページのいちばん上の帯です。ロゴやメニューが入り、多くのサイトでは全ページ共通の形にします。",
  ai:"ヘッダーを作ってください。左にロゴ、右に電話番号を置き、全ページで同じ形にしてください。",
  order:"ヘッダーに、ロゴと電話番号を入れてください。",cap:"どのページでも、同じ帯がいちばん上に出る",rel:["gnav","burger","footer"]},
 {id:"burger",ch:"sp",nm:"ハンバーガーメニュー",alias:"",
  desc:"押すとメニューが開くボタンです。三本の線がハンバーガーに見えるため、こう呼ばれると言われます。画面の狭いスマホでよく使います。",
  ai:"画面の幅が狭いときは、グローバルナビをハンバーガーメニューにまとめてください。押すとメニューが開き、×で閉じる形にしてください。",
  order:"スマホでは、メニューをハンバーガーメニューにまとめてください。",cap:"押すと、隠れていたメニューが開く",rel:["gnav","header","modal"]},
 {id:"crumb",ch:"sp",nm:"パンくずリスト",alias:"",
  desc:"「ホーム ＞ メニュー ＞ 季節のパフェ」のように、今いるページまでの道すじを示す小さな案内です。名前は、童話「ヘンゼルとグレーテル」で帰り道の目印にパンくずを落とした話から来ていると言われます。",
  ai:"各ページの見出しの上に、パンくずリスト(ホーム ＞ 一覧 ＞ 今のページ)を入れてください。今のページ以外はリンクにしてください。",
  order:"下の階層のページには、パンくずリストを付けてください。",cap:"たどってきた道すじを、ページの上に小さく出す",rel:["gnav","header"]},
 {id:"fv",ch:"sp",nm:"ファーストビュー",alias:"そこに置く大きな画像は「メインビジュアル」",
  desc:"ページを開いて、スクロールせずに最初に見える範囲です。広さは画面の大きさで変わります。ここに置く大きな画像はメインビジュアルと呼びます。",
  ai:"ファーストビューに店内の写真を大きく1枚置き、お店の名前と予約ボタンを重ねてください。スマホでもスクロールせずに予約ボタンが見えるようにしてください。",
  order:"ファーストビューに、店内の写真と予約ボタンを入れてください。",cap:"スクロールせずに見える範囲だけがファーストビュー",rel:["cta","slider","responsive"]},
 {id:"cta",ch:"sp",nm:"CTAボタン",alias:"Call To Action(行動を呼びかける)の略",
  desc:"見た人にしてほしいこと(予約・問い合わせ・購入など)へ案内するボタンです。目立つ色や大きさにすることが多いです。",
  ai:"CTAボタンを2つ作ってください。「電話で予約」と「ネットで予約」で、ほかのボタンより大きく、目立つ色にしてください。",
  order:"CTAボタンは「電話で予約」と「ネットで予約」の2つにしてください。",cap:"押すと、してほしい行動(ここでは予約)へ進む",rel:["fv","modal"]},
 {id:"footer",ch:"sp",nm:"フッター",alias:"",
  desc:"ページのいちばん下の帯です。住所、連絡先、ほかのページへのリンク、著作権の表示などを入れます。",
  ai:"フッターに、住所・営業時間・電話番号・地図へのリンク・著作権の表示を入れてください。",
  order:"フッターに、住所と営業時間、地図へのリンクを入れてください。",cap:"ページのいちばん下に、お店の基本の情報をまとめる",rel:["header","pagetop"]},
 {id:"gnav",ch:"pc",nm:"グローバルナビゲーション",alias:"略して「グローバルナビ」「グロナビ」",
  desc:"サイトの主なページへのリンクを並べたものです。多くはヘッダーの中に置き、どのページからでも同じものが使えるようにします。",
  ai:"グローバルナビを作り、「メニュー・お店・予約・アクセス」の4つのページへのリンクを、ヘッダーの右側に並べてください。",
  order:"グローバルナビは「メニュー・お店・予約・アクセス」の4つにしてください。",cap:"主なページへの入り口を、いつも同じ場所に並べる",rel:["header","burger","crumb"]},
 {id:"sidebar",ch:"pc",nm:"サイドバー",alias:"",
  desc:"本文の横に置く細い列です。新着記事やカテゴリなどを入れます。スマホでは本文の下に回すことが多いです。",
  ai:"ブログのページだけ、本文の右にサイドバーを付けてください。中身は新着記事5件とカテゴリの一覧です。スマホでは本文の下に回してください。",
  order:"ブログのページだけ、右にサイドバーを付けてください。",cap:"PCでは本文の横。スマホでは下に回ることが多い",rel:["card","responsive"]},
 {id:"card",ch:"pc",nm:"カード",alias:"並べた形は「カード型レイアウト」",
  desc:"写真・見出し・短い説明を1つの箱にまとめたものです。同じ形の箱を並べて、商品やお知らせの一覧を作ります。",
  ai:"メニューをカード型レイアウトで並べてください。1枚に写真・料理名・値段を入れ、PCは3列、スマホは1列にしてください。",
  order:"メニューはカードで並べて、1枚に写真と値段を入れてください。",cap:"同じ形の箱を並べて一覧にする。この例では1枚に写真・見出し・説明",rel:["sidebar","responsive"]},
 {id:"pagetop",ch:"pc",nm:"ページトップボタン",alias:"「トップへ戻る」ボタン",
  desc:"押すとページのいちばん上に戻るボタンです。長いページの右下によく置きます。",
  ai:"ページを下へスクロールしたら、右下にページトップボタンを出してください。押すといちばん上に戻るようにしてください。",
  order:"長いページには、右下にページトップボタンを付けてください。",cap:"押すと、ページのいちばん上へ戻る",rel:["footer","header"]},
 {id:"modal",ch:"move",nm:"モーダルウィンドウ",alias:"略して「モーダル」。ポップアップと呼ぶ人もいます",
  desc:"ページの上に重ねて出る小さな窓です。開いている間は後ろのページを操作できず、閉じると元に戻ります。",
  ai:"料理の写真を押したら、大きな写真をモーダルウィンドウで見せてください。×か、後ろの暗い所を押すと閉じるようにしてください。",
  order:"お知らせはモーダルではなく、ページの中に載せてください。",cap:"ページの上に重なって出る窓。×で閉じると元に戻る",rel:["cta","accordion"]},
 {id:"accordion",ch:"move",nm:"アコーディオン",alias:"",
  desc:"見出しを押すと中身が開き、もう一度押すと閉じる部品です。楽器のアコーディオンのように伸び縮みするため、こう呼ばれると言われます。よくある質問によく使います。",
  ai:"よくある質問をアコーディオンにしてください。質問を押すと答えが開き、もう一度押すと閉じます。最初はすべて閉じておいてください。",
  order:"よくある質問は、アコーディオンにしてください。",cap:"見出しを押すと開き、もう一度押すと閉じる",rel:["modal","slider"]},
 {id:"slider",ch:"move",nm:"スライダー",alias:"カルーセルとも呼びます。つまみを左右に動かす入力部品を、同じ名前で呼ぶこともあります",
  desc:"何枚かの画像を横に並べ、順に切り替えて見せる部品です。自動で切り替わるものと、矢印で動かすものがあります。",
  ai:"トップにスライダーを置き、写真3枚を矢印と点で切り替えられるようにしてください。自動では切り替えないでください。",
  order:"トップのスライダーは写真3枚で、自動では切り替えないでください。",cap:"枠の中に1枚ずつ見せ、矢印や点で切り替える",rel:["fv","card"]},
 {id:"responsive",ch:"none",nm:"レスポンシブ",alias:"レスポンシブデザイン",
  desc:"1つのページが、画面の幅に合わせて並び方を変える作り方です。PCで3列のものが、スマホでは1列になる、といった形です。",

const zukai=(id)=>{TS=NARROW.matches?1.3:1;const o=svg("0 0 560 300",Z[id](),`${T[id].nm}の図解: ${T[id].cap}`);TS=1;return o;};

/* ---------- ページ ---------- */
const view=document.getElementById("view");
let state={fig:"sp",sel:"burger"};
try{const s=JSON.parse(localStorage.getItem("zukan")||"null");if(s&&FIG[s.fig]&&T[s.sel])state=s;}catch(e){}
const save=()=>{try{localStorage.setItem("zukan",JSON.stringify(state))}catch(e){}};

function pageTop(){
  view.innerHTML=`<div class="stack">
   <div class="term-top"><p class="eyebrow">Webデザイン用語の絵図鑑</p><h1 class="h-xl">その場所、なんて呼ぶ？</h1>
     <p class="lead">下の図は、お店のページの見本です。名前を知りたい所(上の帯やボタンなど)を押すと、そこに色が付き、名前と説明が出ます。発注のときに「上のほうの帯」ではなく「ヘッダー」と伝えられるようにするための図鑑です。</p></div>
   <div class="stage">
     <div class="figure-box">
       <div class="tabs" role="tablist" aria-label="見本図を切り替える">
         <button type="button" role="tab" id="tab-sp" data-fig="sp" aria-selected="${state.fig==="sp"}">スマホのページ</button>
         <button type="button" role="tab" id="tab-pc" data-fig="pc" aria-selected="${state.fig==="pc"}">PCのページ</button></div>
       <div id="fig" role="tabpanel"></div></div>
     <div style="display:grid;gap:14px;min-width:0">
       <div class="chips" id="chips" role="group" aria-label="名前を選ぶ"></div>
       <div class="pick" id="pick" aria-live="polite"></div></div>
   </div>
   <p class="muted">動く部品や、ページの上に場所のない言葉は「<a href="#more">見本図にない言葉</a>」にあります。</p>
  </div>`;
  const draw=()=>{const F=FIG[state.fig];if(!F.parts.includes(state.sel))state.sel=F.parts[0];
    document.getElementById("fig").innerHTML=bigFigure(state.fig,state.sel);
    document.getElementById("chips").innerHTML=F.parts.map(id=>`<button type="button" data-id="${id}" aria-pressed="${id===state.sel}">${T[id].nm}</button>`).join("");
    const x=T[state.sel];
    document.getElementById("pick").innerHTML=`<div class="nm">${esc(x.nm)}</div>${x.alias?`<p class="small muted">${esc(x.alias)}</p>`:""}<p>${esc(x.desc)}</p><a class="go" href="#t-${x.id}">図解と、発注での言い方を見る →</a>`;
    document.querySelectorAll("#fig [data-part],#fig .lab").forEach(el=>el.addEventListener("click",()=>{state.sel=el.dataset.part||el.dataset.id;save();draw();}));
    document.querySelectorAll("#chips button").forEach(b=>b.addEventListener("click",()=>{state.sel=b.dataset.id;save();draw();}));
    document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.fig===state.fig));zen(view);};
  document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{state.fig=b.dataset.fig;save();draw();}));
  draw();
}
function pageMore(){
  view.innerHTML=`<div class="stack"><div class="term-top"><p class="eyebrow">見本図にない言葉</p><h1 class="h-l">動きと、しくみの言葉</h1><p class="lead">押すと開く・切り替わる部品や、ページの上に場所のない言葉です。見本図には描けないので、図解で見せます。</p></div>
   ${CH.filter(c=>c.id==="move"||c.id==="none").map(chapter).join("")}</div>`;
}
const chapter=c=>`<section class="chapter"><div class="chapter-head"><h2 class="h-m">${c.nm}</h2><span class="muted small">${c.note}</span></div><div class="tiles">${TERMS.filter(x=>x.ch===c.id).map(tile).join("")}</div></section>`;
function tile(x){return `<a class="tile" href="#t-${x.id}"><div class="pic">${zukai(x.id)}</div><div class="txt"><span class="nm">${esc(x.nm)}</span></div></a>`;}
function pageList(){
  view.innerHTML=`<div class="stack"><div class="term-top"><p class="eyebrow">用語一覧</p><h1 class="h-l">${TERMS.length}の言葉を、図解で</h1><p class="lead">絵を見て、近いものを押してください。名前が分からなくても、絵から探せます。</p></div>
   ${CH.map(chapter).join("")}</div>`;
}
function pageTerm(id){
  const x=T[id],i=TERMS.indexOf(x),prev=TERMS[i-1],next=TERMS[i+1],ch=CH.find(c=>c.id===x.ch);
  const where=(x.ch==="sp"||x.ch==="pc")?`<div class="box"><h3>見本図での場所</h3><div style="max-width:${x.ch==="sp"?"180px":"100%"}">${smallFigure(x.ch,id)}</div><a class="small" href="#top" data-fig="${x.ch}" data-sel="${id}" id="to-fig">見本図で見る</a></div>`:"";
  view.innerHTML=`<div class="stack">
   <div class="term-top"><p class="eyebrow">${ch.nm}</p><h1 class="h-xl">${esc(x.nm)}</h1>${x.alias?`<p class="muted">${esc(x.alias)}</p>`:""}</div>
   <div class="term-grid">
     <figure class="zukai" style="margin:0"><figcaption class="cap">図解</figcaption>${zukai(id)}<p style="font-weight:700">${esc(x.cap)}</p></figure>
     <div class="side">
       <div class="box"><h3>どんなもの</h3><p>${esc(x.desc)}</p></div>
       <div class="box"><h3>発注で使える言い方(例)</h3><p class="who">制作会社に伝えるとき</p><p class="order">「${esc(x.order)}」</p><p class="who">AIに指示するとき</p><p class="order ai">「${esc(x.ai)}」</p></div>
       ${where}
     </div>
   </div>
   <section class="box" style="background:none;padding:0"><h3>あわせて覚えたい言葉</h3><div class="rel">${x.rel.map(r=>`<a href="#t-${r}">${esc(T[r].nm)}</a>`).join("")}</div></section>
   <nav class="pager" aria-label="前後の言葉">${prev?`<a href="#t-${prev.id}">← ${esc(prev.nm)}</a>`:"<span></span>"}${next?`<a href="#t-${next.id}">${esc(next.nm)} →</a>`:`<a href="#list">用語一覧へ</a>`}</nav>
  </div>`;
  const tf=document.getElementById("to-fig");if(tf)tf.addEventListener("click",()=>{state.fig=tf.dataset.fig;state.sel=tf.dataset.sel;save();});
}
function pageHowto(){
  view.innerHTML=`<div class="stack"><div class="term-top"><p class="eyebrow">使い方</p><h1 class="h-l">頼む前に、3つだけ</h1><p class="lead">制作会社に頼むときも、AIにページを作らせるときも、言葉に詰まったときのための使い方です。</p></div>
   <ol class="steps">
    <li data-n="１"><div><h3>直したい所を、見本図で押す</h3><p>「上のほうの帯」のように、場所なら分かるときは<a href="#top">見本図</a>で押します。押すと名前が出ます。</p></div></li>
    <li data-n="２"><div><h3>場所がないものは、図解で探す</h3><p>「スマホでも見やすく」「検索で見つかるように」のような話は、<a href="#more">見本図にない言葉</a>の図解から近いものを選びます。</p></div></li>
    <li data-n="３"><div><h3>例の言い方を、まねして使う</h3><p>各用語のページに「発注で使える言い方」が2通りあります。制作会社に伝えるときの短い言い方と、AIに指示するときの細かい言い方です。例は架空のお店の中身なので、自分のお店の内容に書き換えて使ってください。</p></div></li>
   </ol>
   <div class="box" style="max-width:760px"><h3>AIに指示するときのこつ</h3><p>用語の名前に加えて、「何を入れるか」「どこに置くか」「スマホではどうするか」の3つを一緒に書くと、思った形に近づきます。例:「ヘッダーを作り、左にロゴ、右に電話番号を置いてください。スマホでは電話番号をアイコンにしてください。」</p></div>
   <div class="box" style="max-width:760px"><h3>注意</h3><p>同じものでも、制作会社やAIによって呼び方や受け取り方が少し違うことがあります。通じないときは、見本図や図解の画面を見せて「ここのことです」と伝えてください。</p></div></div>`;
}

/* 画面に出る文字の数字と?を全角にする(社長の指示)。属性やURLには触れない */
function zen(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){if(n.parentNode.closest&&n.parentNode.closest("style,script"))continue;
    const v=n.nodeValue.replace(/[0-9]/g,d=>String.fromCharCode(d.charCodeAt(0)+0xFEE0)).replace(/\?/g,"？");if(v!==n.nodeValue)n.nodeValue=v;}}
function route(){
  const h=location.hash.replace("#","")||"top";
  if(h.startsWith("t-")&&T[h.slice(2)])pageTerm(h.slice(2));
  else if(h==="list")pageList();
  else if(h==="howto")pageHowto();
  else if(h==="more")pageMore();
  else pageTop();
  zen(view);
  const tch=h.startsWith("t-")&&T[h.slice(2)]?T[h.slice(2)].ch:null;
  const navKey=tch?((tch==="move"||tch==="none")?"more":"list"):(["list","howto","more"].includes(h)?h:"top");
  document.querySelectorAll(".gnav a").forEach(a=>a.dataset.nav===navKey?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
}
NARROW.addEventListener("change",()=>route());
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0);document.getElementById("main").focus({preventScroll:true});});
document.getElementById("skip").addEventListener("click",()=>document.getElementById("main").focus());
zen(document.querySelector(".site-head"));zen(document.querySelector(".site-foot"));
route();
</script>
